[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    golden: snapshot checks of stage outputs on the bundled example deal (update with --update-goldens)
    fuzz: property-based tests (Hypothesis); depth set by HYPOTHESIS_PROFILE=dev|ci|deep
    cli: runs a plugin script as a subprocess
    needs_node: needs node and the docx package (npm ci in scripts/redline)
    needs_soffice: needs LibreOffice
filterwarnings =
    ignore::DeprecationWarning
