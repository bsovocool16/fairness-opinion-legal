name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System tools (pdftotext; LibreOffice is left out, so PDF output is skipped)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Dependencies
        run: make deps
      - name: Tests
        run: make test
